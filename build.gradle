buildscript {
    repositories {
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://repo.grails.org/grails/core" }
    }
    dependencies {
        classpath "org.apache.grails:grails-gradle-plugins:$grailsGradlePluginVersion"
        classpath "com.vanniktech:gradle-maven-publish-plugin:$vanniktechPublishVersion"
    }
}

version = "${productVersion}${(isRelease.toBoolean()) ? '' : '-SNAPSHOT'}"
// Was com.exa.exacloud through v1.1.5 (Artifactory). Maven Central only accepts the
// verified com.helpchoice namespace; the artifactId stays HALM for continuity.
group 'com.helpchoice.grails'

apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'org.apache.grails.gradle.grails-plugin'
apply plugin: 'org.apache.grails.gradle.grails-gson'
apply plugin: 'com.vanniktech.maven.publish'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.grails.org/grails/core' }
}

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

dependencies {
    developmentOnly("org.springframework.boot:spring-boot-devtools")
    console "org.apache.grails:grails-console"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.apache.grails:grails-core"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.apache.grails:grails-views-gson"
    profile "org.apache.grails.profiles:web-plugin"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.apache.grails:grails-testing-support-web"
}

if (!ext.has('ignoreTestFailures')) {
    ext.ignoreTestFailures = false
}

test {
    ignoreFailures = project.ext.ignoreTestFailures.toBoolean()
}

tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.ALL
    gradleVersion = gradleWrapperVersion
}


bootRun {
    ignoreExitValue true
    jvmArgs(
        '-Dspring.output.ansi.enabled=always',
        '-XX:TieredStopAtLevel=1',
        '-Xmx1024m')
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

tasks.withType(GroovyCompile) {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m']
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
}
// enable if you wish to package this plugin as a standalone application
bootJar.enabled = false

tasks.named("bootJar") {
    archiveClassifier = 'boot'
}

tasks.named("jar") {
    archiveClassifier = ''
}

// ── Maven Central publishing ──────────────────────────────────────────────────
// Credentials and the GPG key come from ~/.gradle/gradle.properties:
//   mavenCentralUsername / mavenCentralPassword — Central Portal user token
//   signingInMemoryKey / signingInMemoryKeyPassword — armoured secret key
// Release:   set isRelease=true in gradle.properties, then ./gradlew publishToMavenCentral
// Snapshot:  isRelease=false publishes -SNAPSHOT to the Central snapshot repository.
//
// The plugin applies maven-publish and signing itself and builds the sources and
// javadoc jars Central requires — so no `java { withSourcesJar() }` here.
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates(project.group.toString(), 'HALM', project.version.toString())

    pom {
        name.set('HAL Maker 4 GSON view')
        description.set('Grails plugin providing a DSL that builds valid HAL+JSON documents from ' +
            'GSON views. Replaces the built-in GSON HAL extension, works with arbitrary objects ' +
            'rather than only domain classes, and keeps view code debuggable by allowing it to be ' +
            'run verbatim inside a controller.')
        url.set('https://github.com/C06A/HALM')
        inceptionYear.set('2017')

        licenses {
            license {
                name.set('Apache-2.0')
                url.set('https://www.apache.org/licenses/LICENSE-2.0')
            }
        }
        developers {
            developer {
                id.set('C06A')
                name.set('Constantine Bialik')
                email.set('grails@helpchoice.com')
            }
        }
        scm {
            url.set('https://github.com/C06A/HALM')
            connection.set('scm:git:https://github.com/C06A/HALM.git')
            developerConnection.set('scm:git:ssh://git@github.com/C06A/HALM.git')
        }
        issueManagement {
            system.set('GitHub')
            url.set('https://github.com/C06A/HALM/issues')
        }
    }
}

// All sources are Groovy, so the `javadoc` task is NO-SOURCE and the plugin's javadoc jar would
// ship empty. Central accepts that, but v1.0.1 published real docs — fill the jar from groovydoc.
// The plugin registers plainJavadocJar during its own afterEvaluate, so match it lazily. Match by
// name, not withType(Jar): the plugin's JavadocJar extends org.gradle.jvm.tasks.Jar, while the
// bare `Jar` in a build script resolves to its subclass org.gradle.api.tasks.bundling.Jar.
tasks.matching { it.name == 'plainJavadocJar' }.configureEach {
    from tasks.named('groovydoc')
}

// groovydoc's classpath is sourceSets.main.output, which compileGsonViews also writes into.
tasks.named('groovydoc') {
    dependsOn tasks.named('compileGsonViews')
}

// Grails supplies dependency versions through its BOM, so the declarations above carry none.
// Without this mapping the generated POM would ship those dependencies with empty <version>
// elements. Kept from the previous Artifactory setup.
publishing {
    publications.withType(MavenPublication).configureEach {
        versionMapping {
            usage('java-api') {
                fromResolutionOf('runtimeClasspath')
            }
            usage('java-runtime') {
                fromResolutionResult()
            }
        }
    }
}